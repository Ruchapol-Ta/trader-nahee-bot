name: Daily EOD Scan

# Runs the V2/V3 end-of-day scan after the US close on US trading days.
# GitHub Actions cron is ALWAYS UTC. 21:30 UTC = 04:30 Asia/Bangkok (next day).
#   "30 21 * * 1-5"  ->  21:30 UTC Mon-Fri  ->  04:30 BKK Tue-Sat
#   This intentionally tracks each US weekday close (US session runs Mon-Fri).
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run-now (live: sends Telegram + writes journal) OR dry-run-review (no send, no journal)"
        type: choice
        default: run-now
        options:
          - run-now
          - dry-run-review

# write: the persist-journal step pushes journal history to the journal-data branch.
permissions:
  contents: write

concurrency:
  group: daily-eod-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify required secret is present
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is not set (repo Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Run EOD scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Defaults to 'test' if the secret is unset, so CI never accidentally hits prod.
          TELEGRAM_TARGET_MODE: ${{ secrets.TELEGRAM_TARGET_MODE || 'test' }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_PROD_CHAT_ID: ${{ secrets.TELEGRAM_PROD_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Scheduled runs have no inputs -> default to run-now. Manual runs can pick dry-run-review.
          MODE: ${{ github.event.inputs.mode || 'run-now' }}
        run: |
          echo "Run mode: $MODE | Telegram target mode: ${TELEGRAM_TARGET_MODE}"
          if [ "$MODE" = "dry-run-review" ]; then
            python signal_bot.py --v3-dry-run-review
          else
            python signal_bot.py --run-now
          fi

      - name: Persist journal to journal-data branch
        # Skipped when the scan step failed (default step success check) and on
        # manual dry-run-review runs (which never write a journal anyway).
        # Scheduled runs have no inputs -> mode defaults to run-now -> persists.
        if: ${{ (github.event.inputs.mode || 'run-now') == 'run-now' }}
        run: |
          set -e
          if [ ! -s data/signal_journal.jsonl ]; then
            echo "No journal records produced; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WT="$RUNNER_TEMP/journal-wt"
          # Fetch the freshest branch tip immediately before appending and
          # pushing (pull-before-push); the daily-eod-scan concurrency group
          # already serializes scan runs, so races are effectively impossible.
          if git fetch origin journal-data; then
            git worktree add -B journal-data "$WT" FETCH_HEAD
          else
            # First run ever: create the orphan data branch from an empty tree
            # so journal history shares no ancestry with main.
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            INIT_COMMIT=$(git commit-tree "$EMPTY_TREE" -m "journal: initialize data branch")
            git branch journal-data "$INIT_COMMIT"
            git worktree add "$WT" journal-data
          fi
          mkdir -p "$WT/data"
          # A fresh CI checkout starts with no journal file, so today's file
          # holds exactly this run's records — append them to branch history.
          cat data/signal_journal.jsonl >> "$WT/data/signal_journal.jsonl"
          cd "$WT"
          git add data/signal_journal.jsonl
          git commit -m "journal: run ${GITHUB_RUN_ID} ($(date -u +%Y-%m-%d))"
          git push origin journal-data

      - name: Upload logs and journal (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scan-output-${{ github.run_id }}
          path: |
            signal_bot.log*
            data/signal_journal.jsonl
          if-no-files-found: warn
          retention-days: 14
